[project]
name = "brain-runtime"
version = "0.2.0"
description = "Cloud-native self-rewiring cognitive runtime"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "neo4j>=5.28,<7",
  "temporalio>=1.15,<2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["brain*"]
exclude = ["apps*", "db*", "docs*", "infra*", "reports*", "scripts*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"apps/api/main.py" = ["E402"]
