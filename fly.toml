app = 'brain-api'
primary_region = 'yyz'

# Canonical API+worker host alternative to Railway.
# Same image and entrypoint as railway.toml / railway.brain-api-live.toml:
# Dockerfile → tools.live_cockpit_routes:app (tenant_app + Vercel OIDC bridge).
# Postgres remains external (Supabase). Observatory remains on Vercel.

[build]
  dockerfile = 'Dockerfile'

[deploy]
  # Match brain-api-live pre-tenant ceiling (#170). After the explicit tenant/RLS
  # release applies 019+, remove --max-version 18 so Fly applies the full ledger.
  release_command = 'python tools/apply_migrations.py --max-version 18'

[env]
  BRAIN_ENV = 'production'
  BRAIN_EXTERNAL_ACTIONS_ENABLED = 'false'
  # Inline cognition remains available if worker count is 0; prefer scaling the
  # worker process so ingest/maintenance run on the intended host (#168).
  BRAIN_INLINE_COGNITION = 'true'
  BRAIN_TENANT_MODE = 'disabled'

[processes]
  # HTTP surface: bridged tenant app (not bare apps.api.main).
  app = 'sh -c "python -m uvicorn tools.live_cockpit_routes:app --host 0.0.0.0 --port ${PORT:-8000}"'
  # Cognition host: same image carries apps.worker; scale independently.
  worker = 'python -m apps.worker.main'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '25s'
    method = 'GET'
    path = '/ready'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['worker']
