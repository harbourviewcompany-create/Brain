app = 'brain-api'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[env]
  BRAIN_ENV = 'production'
  BRAIN_EXTERNAL_ACTIONS_ENABLED = 'false'

[processes]
  app = 'uvicorn apps.api.main:app --host 0.0.0.0 --port 8000'
  worker = 'python -m apps.worker.main'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
