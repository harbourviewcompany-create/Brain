# Railway — preferred quick production host for Brain API
# Docs: https://docs.railway.com
#
# Deploy: connect GitHub repo → set DATABASE_URL → deploy
# Start command is inferred from Dockerfile CMD / Procfile.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
