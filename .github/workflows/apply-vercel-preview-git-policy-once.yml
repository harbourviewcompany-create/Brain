name: Apply Vercel Preview Git Policy Once

on:
  push:
    branches:
      - fix/vercel-project-authoritative-preview-gate

permissions:
  contents: read
  id-token: write

jobs:
  apply-policy:
    if: github.repository == 'harbourviewcompany-create/Brain'
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: prj_Fr14GlGBNeae7coqrnhgXteHC0jA
      VERCEL_TEAM_ID: team_0rK4jTvMLlSufR0ZzX4LCKYi
      VERCEL_TEAM_SLUG: harbourview
      STATIC_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Request GitHub OIDC token
        if: env.STATIC_VERCEL_TOKEN == ''
        uses: actions/github-script@v7
        id: github-oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Resolve short-lived Vercel authorization
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.github-oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${STATIC_VERCEL_TOKEN}" ]]; then
            TOKEN="${STATIC_VERCEL_TOKEN}"
            AUTH_SOURCE="repository secret"
          else
            TOKEN_RESPONSE="$(curl --fail-with-body --silent --show-error \
              -X POST https://api.vercel.com/login/oauth/token \
              --data 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
              --data 'client_id=cl_kyUx2zVvA4MGptBohkmtYHJly2XltXzD' \
              --data 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
              --data 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
              --data-urlencode "team_id_or_slug=${VERCEL_TEAM_SLUG}" \
              --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}")"
            TOKEN="$(printf '%s' "${TOKEN_RESPONSE}" | jq -er '.access_token')"
            AUTH_SOURCE="GitHub OIDC token exchange"
          fi

          echo "::add-mask::${TOKEN}"
          echo "VERCEL_ACCESS_TOKEN=${TOKEN}" >> "${GITHUB_ENV}"
          echo "Vercel authorization source: ${AUTH_SOURCE}"

      - name: Prove project-management authorization before mutation
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_TEAM_ID}"
          CURRENT="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_ACCESS_TOKEN}" \
            "${API}")"
          printf '%s' "${CURRENT}" | jq -e --arg project "${VERCEL_PROJECT_ID}" '.id == $project' >/dev/null
          echo "Project-management authorization verified before mutation."

      - name: Apply project-authoritative Git source policy
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_TEAM_ID}"

          CURRENT="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_ACCESS_TOKEN}" \
            "${API}")"

          CURRENT_POLICY="$(printf '%s' "${CURRENT}" | jq -c '.deploymentPolicy // {}')"
          NEW_POLICY="$(printf '%s' "${CURRENT_POLICY}" | jq -c '
            .gitSources = [
              {
                sources: [{provider: "github", org: "harbourviewcompany-create", repo: "Brain"}],
                enabled: false,
                environments: [{type: "system", target: "preview"}]
              },
              {
                sources: [{provider: "github", org: "harbourviewcompany-create", repo: "Brain"}],
                enabled: true,
                environments: [{type: "system", target: "production"}]
              }
            ]
          ')"

          BODY="$(jq -cn --argjson policy "${NEW_POLICY}" '{deploymentPolicy: $policy}')"
          UPDATED="$(curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${VERCEL_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${BODY}" \
            "${API}")"

          printf '%s' "${UPDATED}" | jq -e '
            .deploymentPolicy.gitSources == [
              {
                sources: [{provider: "github", org: "harbourviewcompany-create", repo: "Brain"}],
                enabled: false,
                environments: [{type: "system", target: "preview"}]
              },
              {
                sources: [{provider: "github", org: "harbourviewcompany-create", repo: "Brain"}],
                enabled: true,
                environments: [{type: "system", target: "production"}]
              }
            ]
          ' >/dev/null

          AFTER="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_ACCESS_TOKEN}" \
            "${API}")"

          printf '%s' "${AFTER}" | jq -e '
            .deploymentPolicy.gitSources == [
              {
                sources: [{provider: "github", org: "harbourviewcompany-create", repo: "Brain"}],
                enabled: false,
                environments: [{type: "system", target: "preview"}]
              },
              {
                sources: [{provider: "github", org: "harbourviewcompany-create", repo: "Brain"}],
                enabled: true,
                environments: [{type: "system", target: "production"}]
              }
            ]
          ' >/dev/null

          {
            echo '### Vercel project deployment policy applied'
            echo '- GitHub Brain → Preview: disabled'
            echo '- GitHub Brain → Production: enabled'
            echo '- Existing non-Git deploymentSources preserved'
          } >> "${GITHUB_STEP_SUMMARY}"
