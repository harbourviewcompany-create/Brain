name: Deploy Vercel Preview

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit SHA to deploy as a deliberate Vercel preview
        required: true
        default: main
        type: string
      preview_name:
        description: Single-segment preview name (letters, numbers, dot, underscore, hyphen)
        required: true
        type: string

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_0rK4jTvMLlSufR0ZzX4LCKYi
  VERCEL_PROJECT_ID: prj_Fr14GlGBNeae7coqrnhgXteHC0jA

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate preview name
        env:
          PREVIEW_NAME: ${{ inputs.preview_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${PREVIEW_NAME}" =~ ^[a-z0-9][a-z0-9._-]{0,62}$ ]]; then
            echo "preview_name must be one lowercase path segment using letters, numbers, dot, underscore, or hyphen" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Vercel authorization is configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN}" ]]; then
            echo "Repository secret VERCEL_TOKEN is required for deliberate preview deployments." >&2
            exit 1
          fi

      - name: Build and deploy deliberate Vercel preview
        id: deploy
        working-directory: apps/observatory
        env:
          PREVIEW_NAME: ${{ inputs.preview_name }}
          SOURCE_REF: ${{ inputs.source_ref }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"

          npx --yes vercel@latest pull \
            --yes \
            --environment=preview \
            --token "${VERCEL_TOKEN}" \
            --scope harbourview

          npx --yes vercel@latest build \
            --token "${VERCEL_TOKEN}" \
            --scope harbourview

          DEPLOYMENT_URL="$(npx --yes vercel@latest deploy \
            --prebuilt \
            --yes \
            --token "${VERCEL_TOKEN}" \
            --scope harbourview \
            --meta "brainPreviewName=${PREVIEW_NAME}" \
            --meta "brainSourceRef=${SOURCE_REF}" \
            --meta "brainSourceSha=${SOURCE_SHA}")"

          echo "deployment_url=${DEPLOYMENT_URL}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Deliberate Vercel preview"
            echo "- Source ref: \`${SOURCE_REF}\`"
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- Preview name: \`${PREVIEW_NAME}\`"
            echo "- Deployment: ${DEPLOYMENT_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
