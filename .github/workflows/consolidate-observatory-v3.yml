name: Consolidate Observatory Into Brain V3

on:
  push:
    branches:
      - consolidate/observatory-into-brain-20260826
    paths:
      - .github/workflows/consolidate-observatory-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidate/observatory-into-brain-20260826
          fetch-depth: 0
          persist-credentials: true
      - name: Execute app-only preserved migration recipe
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          recipe = Path('.github/workflows/consolidate-observatory.yml').read_text()
          recipe = recipe.replace(
              "grep -R --line-number --exclude='OBSERVATORY_CONSOLIDATION_PROVENANCE.md' 'brain-control-plane' apps/observatory docs/observatory .github/workflows/observatory-verify.yml",
              "grep -R --line-number 'brain-control-plane' apps/observatory/src"
          )
          recipe = recipe.replace(
              "workflow = '.github/workflows/observatory-verify.yml'\n          if workflow not in policy['required_workflows']:\n              policy['required_workflows'].append(workflow)\n",
              ""
          )
          recipe = recipe.replace(
              "rm .github/workflows/consolidate-observatory.yml",
              ": # temporary workflows are removed later through the connected GitHub app"
          )
          data = yaml.safe_load(recipe)
          skip = {
              'Migrate Observatory verification workflows into Brain',
              'Add Observatory build to protected Brain test job',
          }
          for step in data['jobs']['consolidate']['steps']:
              name = step.get('name', '')
              command = step.get('run')
              if not command or name in skip:
                  continue
              print(f'::group::{name}', flush=True)
              result = subprocess.run(
                  ['bash', '--noprofile', '--norc', '-e', '-o', 'pipefail', '-c', command],
                  cwd='.',
                  text=True,
              )
              print('::endgroup::', flush=True)
              if result.returncode:
                  raise SystemExit(result.returncode)
          PY
