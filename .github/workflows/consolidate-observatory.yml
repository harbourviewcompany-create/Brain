name: Consolidate Observatory Into Brain

on:
  push:
    branches:
      - consolidate/observatory-into-brain-20260826
    paths:
      - .github/workflows/consolidate-observatory.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout canonical Brain branch
        uses: actions/checkout@v4
        with:
          ref: consolidate/observatory-into-brain-20260826
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout immutable split-repo source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/harbourviewcompany-create/brain-control-plane.git /tmp/brain-control-plane
          git -C /tmp/brain-control-plane checkout 03e3c462ff8f8233033457fc703c418d21200b32
          test "$(git -C /tmp/brain-control-plane rev-parse HEAD)" = "03e3c462ff8f8233033457fc703c418d21200b32"

      - name: Copy complete Observatory application and canonical documentation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/observatory docs/observatory
          mkdir -p apps/observatory docs/observatory
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='docs' \
            /tmp/brain-control-plane/ apps/observatory/
          cp -a /tmp/brain-control-plane/docs/. docs/observatory/

      - name: Adapt split-repo metadata to canonical Brain monorepo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          app = root / 'apps/observatory'
          source_sha = '03e3c462ff8f8233033457fc703c418d21200b32'

          package_path = app / 'package.json'
          package = json.loads(package_path.read_text())
          package['name'] = 'brain-observatory'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          env_path = app / '.env.example'
          env = env_path.read_text()
          env = env.replace('Brain Control Plane', 'Brain Observatory')
          env_path.write_text(env)

          verify_path = app / 'scripts/verify-observatory.mjs'
          verify = verify_path.read_text()
          verify = verify.replace('"docs/BRAIN_OBSERVATORY.md"', '"../../docs/observatory/BRAIN_OBSERVATORY.md"')
          verify_path.write_text(verify)

          app_readme = app / 'README.md'
          readme = app_readme.read_text()
          readme = readme.replace('brain-control-plane', 'Brain/apps/observatory')
          app_readme.write_text(
              f'> Canonical location: `harbourviewcompany-create/Brain/apps/observatory`. '
              f'Consolidated from `harbourviewcompany-create/brain-control-plane` at `{source_sha}`.\n\n' + readme
          )

          for doc in (root / 'docs/observatory').glob('*.md'):
              text = doc.read_text()
              text = text.replace('harbourviewcompany-create/brain-control-plane', 'harbourviewcompany-create/Brain')
              doc.write_text(
                  f'> Canonical Brain copy. Source preserved from `harbourviewcompany-create/brain-control-plane@{source_sha}`. '
                  'Paths beginning with `src/` refer to `apps/observatory/src/` in the consolidated repository.\n\n' + text
              )

          brain_readme = root / 'README.md'
          marker = '## Brain Observatory frontend'
          text = brain_readme.read_text()
          if marker not in text:
              text += f'''\n\n{marker}\n\nThe canonical Next.js Observatory and browser-safe BFF live in `apps/observatory`.\nThe application was consolidated from the accidental split repository `harbourviewcompany-create/brain-control-plane` at immutable source `{source_sha}`.\nVercel production must deploy this repository's `main` branch with Root Directory `apps/observatory`; production rewiring is intentionally not performed by the consolidation PR.\n'''
              brain_readme.write_text(text)
          PY

      - name: Migrate Observatory verification workflows into Brain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          src = Path('/tmp/brain-control-plane/.github/workflows')
          dst = Path('.github/workflows')

          verify = (src / 'observatory-verify.yml').read_text()
          replacements = {
              '- "src/**"': '- "apps/observatory/src/**"',
              '- "scripts/verify-observatory.mjs"': '- "apps/observatory/scripts/verify-observatory.mjs"',
              '- "package.json"': '- "apps/observatory/package.json"',
              '- "eslint.config.mjs"': '- "apps/observatory/eslint.config.mjs"',
              '- "tailwind.config.ts"': '- "apps/observatory/tailwind.config.ts"',
              '- "docs/BRAIN_OBSERVATORY.md"': '- "docs/observatory/BRAIN_OBSERVATORY.md"',
          }
          for old, new in replacements.items():
              verify = verify.replace(old, new)
          verify = verify.replace(
              '      - name: Install dependencies\n        run: npm install --no-audit --no-fund',
              '      - name: Install dependencies\n        working-directory: apps/observatory\n        run: npm install --no-audit --no-fund'
          )
          for name, cmd in [
              ('Lint', 'npm run lint'),
              ('Typecheck', 'npm run typecheck'),
              ('Observatory structural tests', 'npm run test:observatory'),
              ('Production build', 'npm run build'),
          ]:
              verify = verify.replace(
                  f'      - name: {name}\n        run: {cmd}',
                  f'      - name: {name}\n        working-directory: apps/observatory\n        run: {cmd}'
              )
          verify = verify.replace('          mkdir -p evidence\n          npm run start', '          mkdir -p apps/observatory/evidence\n          cd apps/observatory\n          npm run start')
          verify = verify.replace('evidence/brain-observatory-desktop.png', 'evidence/brain-observatory-desktop.png')
          verify = verify.replace('evidence/brain-observatory-mobile.png', 'evidence/brain-observatory-mobile.png')
          verify = verify.replace('          path: evidence/*.png', '          path: apps/observatory/evidence/*.png')
          (dst / 'observatory-verify.yml').write_text(verify)

          for source_name, dest_name in [
              ('postdeploy-observatory-audit.yml', 'postdeploy-observatory-audit.yml'),
              ('verify-observatory-edges-production.yml', 'verify-observatory-edges-production.yml'),
          ]:
              text = (src / source_name).read_text()
              # These are retained as explicit post-deploy verification tools, not PR-time deployment actions.
              start = text.index('on:')
              permissions = text.index('\npermissions:')
              text = text[:start] + 'on:\n  workflow_dispatch:\n' + text[permissions:]
              text = text.replace(
                  '          npm install --no-save --no-package-lock playwright@1.55.0',
                  '          cd apps/observatory\n          npm install --no-save --no-package-lock playwright@1.55.0'
              )
              text = text.replace(
                  '          npx playwright install --with-deps chromium',
                  '          cd apps/observatory\n          npx playwright install --with-deps chromium'
              )
              # Browser audit scripts write evidence relative to repository root; keep those paths stable.
              (dst / dest_name).write_text(text)
          PY

      - name: Add canonical Observatory control traceability
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/control/OBSERVATORY_CONSOLIDATION_PROVENANCE.md <<'EOF'
          # Brain Observatory consolidation provenance

          Status: REVIEW / repository consolidation candidate. Production remains HOLD.

          Canonical repository: `harbourviewcompany-create/Brain`
          Canonical application path: `apps/observatory`
          Preserved source repository: `harbourviewcompany-create/brain-control-plane`
          Preserved source commit: `03e3c462ff8f8233033457fc703c418d21200b32`
          Brain consolidation base: `28949d971becd1c9fcfa8607ef83f51ee4c8d980`

          The split repository is treated as an accidental repository boundary, not a separate product. Its complete Next.js application tree is copied into `apps/observatory`; its Observatory documentation is copied to `docs/observatory`; its verification workflows are adapted to the canonical Brain repository. No production deployment, Vercel project mutation, domain mutation, Railway mutation, database write, or archive/delete action against the split repository is part of this change.

          Intentional adaptations from the preserved source are limited to canonical path/repository metadata, the package name, verification working directories, Brain control traceability, and protected CI integration. Runtime UI/BFF source under `apps/observatory/src` is otherwise preserved from the cited source commit.

          Retirement gate for `brain-control-plane`: consolidated Brain PR green; source-to-destination inventory verified; Vercel Git integration rewired to Brain/main with Root Directory `apps/observatory`; production domain/env/OIDC identity retained; production parity audit green; only then archive/retire the split repository in a separate explicitly authorized action.
          EOF

          cat > docs/control/source-requirement-registry.observatory.json <<'EOF'
          {
            "registry_id": "brain-source-requirement-registry-observatory-extension-v1",
            "status": "APPROVED_FOR_TRACEABILITY_ENFORCEMENT",
            "purpose": "Canonical traceability extension for the Brain Observatory frontend/BFF consolidated from the accidental brain-control-plane repository split.",
            "rules": [
              "harbourviewcompany-create/Brain is the sole canonical Brain repository.",
              "The Observatory frontend and browser-safe BFF live under apps/observatory.",
              "The split repository source commit remains immutable provenance until retirement parity is proven.",
              "Vercel production rewiring and split-repository retirement remain HOLD until separate parity evidence exists."
            ],
            "sources": [
              {
                "source_id": "SRC-OBSERVATORY-SPLIT-REPO",
                "path": "docs/control/OBSERVATORY_CONSOLIDATION_PROVENANCE.md",
                "label": "SOURCE"
              },
              {
                "source_id": "SRC-OBSERVATORY-CONTRACT",
                "path": "docs/observatory/BRAIN_OBSERVATORY.md",
                "label": "APPROVED"
              },
              {
                "source_id": "SRC-OBSERVATORY-PRODUCTION-WIRING",
                "path": "docs/observatory/PRODUCTION_WIRING.md",
                "label": "REVIEW-ONLY"
              }
            ],
            "requirements": [
              {
                "requirement_id": "REQ-OBSERVATORY-SINGLE-CANONICAL-REPO",
                "source_ids": ["SRC-OBSERVATORY-SPLIT-REPO"],
                "label": "APPROVED"
              },
              {
                "requirement_id": "REQ-OBSERVATORY-BROWSER-BFF",
                "source_ids": ["SRC-OBSERVATORY-CONTRACT", "SRC-OBSERVATORY-PRODUCTION-WIRING"],
                "label": "APPROVED"
              },
              {
                "requirement_id": "REQ-OBSERVATORY-UI-PARITY",
                "source_ids": ["SRC-OBSERVATORY-SPLIT-REPO", "SRC-OBSERVATORY-CONTRACT"],
                "label": "APPROVED"
              },
              {
                "requirement_id": "REQ-OBSERVATORY-VERCEL-ROOT",
                "source_ids": ["SRC-OBSERVATORY-PRODUCTION-WIRING"],
                "label": "REVIEW-ONLY"
              }
            ],
            "code_module_records": [
              {
                "record_id": "TRACE-OBSERVATORY-UI",
                "paths": [
                  "apps/observatory/src/app/page.tsx",
                  "apps/observatory/src/components/observatory/BrainObservatory.tsx",
                  "apps/observatory/src/hooks/useBrainObservatory.ts",
                  "apps/observatory/src/lib/observatory.ts"
                ],
                "classification": "APPROVED",
                "go_hold_status": "REVIEW",
                "source_ids": ["SRC-OBSERVATORY-SPLIT-REPO", "SRC-OBSERVATORY-CONTRACT"],
                "requirement_ids": ["REQ-OBSERVATORY-SINGLE-CANONICAL-REPO", "REQ-OBSERVATORY-UI-PARITY"],
                "owner_object": "Brain Observatory frontend",
                "schema": "typed Observatory read models under apps/observatory/src/types and browser-safe display state",
                "runtime_service": "Next.js App Router application under apps/observatory",
                "state_machine": "same-origin BFF reads -> typed Observatory model -> deterministic cognitive visualization -> live/quiet/degraded display states",
                "fixtures": ["apps/observatory/scripts/verify-observatory.mjs"],
                "tests": ["npm --prefix apps/observatory run verify", ".github/workflows/observatory-verify.yml"],
                "acceptance_criteria": ["root route renders Brain Observatory", "no mock imports in Observatory runtime", "desktop/mobile build and structural verification pass", "existing production UI behavior is preserved before rewiring"],
                "audit_events": ["OBSERVATORY_STRUCTURAL_VERIFICATION", "OBSERVATORY_VISUAL_EVIDENCE"],
                "source_preservation": "complete split-repo UI source preserved under apps/observatory from immutable source commit",
                "unresolved_gaps": ["Vercel Git integration still points to the split repository until separately rewired", "production parity after rewiring remains HOLD"]
              },
              {
                "record_id": "TRACE-OBSERVATORY-BFF",
                "paths": [
                  "apps/observatory/src/app/api/brain/[...path]/route.ts",
                  "apps/observatory/src/lib/brain-upstream.ts"
                ],
                "classification": "APPROVED",
                "go_hold_status": "REVIEW",
                "source_ids": ["SRC-OBSERVATORY-SPLIT-REPO", "SRC-OBSERVATORY-PRODUCTION-WIRING"],
                "requirement_ids": ["REQ-OBSERVATORY-BROWSER-BFF", "REQ-OBSERVATORY-VERCEL-ROOT"],
                "owner_object": "Browser-safe Brain BFF",
                "schema": "allowlisted /api/brain path proxy with Vercel OIDC primary identity and server API-key fallback",
                "runtime_service": "Next.js route handler and server-only upstream resolver",
                "state_machine": "browser same-origin request -> allowlist -> Vercel OIDC/API-key server identity -> Railway Brain API -> no-store response",
                "fixtures": ["apps/observatory/scripts/verify-observatory.mjs"],
                "tests": ["npm --prefix apps/observatory run verify", ".github/workflows/observatory-verify.yml"],
                "acceptance_criteria": ["browser never receives upstream API key", "protected upstream paths fail closed without server identity", "Vercel OIDC behavior remains intact", "health/ready public paths remain available"],
                "audit_events": ["OBSERVATORY_BFF_IDENTITY_VERIFIED", "OBSERVATORY_BFF_UPSTREAM_REJECTED"],
                "source_preservation": "BFF/OIDC source preserved from the split repository and moved without relaxing authentication",
                "unresolved_gaps": ["production Vercel project rewiring remains HOLD", "post-rewire OIDC subject/audience parity must be verified"]
              }
            ]
          }
          EOF

          cat > docs/control/module-build-ready-traceability.observatory.md <<'EOF'
          # Observatory module BUILD-READY traceability extension

          BUILD-READY requires all owner object, schema, runtime service, state machine, fixtures, tests, acceptance criteria, audit events and GO/HOLD status evidence to be complete. Production remains HOLD until Vercel is rewired and parity is proven.

          | Module | owner object | schema | runtime service | state machine | fixtures | tests | acceptance criteria | audit events | GO/HOLD status |
          | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
          | `apps/observatory/src/app/page.tsx`; `apps/observatory/src/components/observatory/BrainObservatory.tsx`; `apps/observatory/src/hooks/useBrainObservatory.ts`; `apps/observatory/src/lib/observatory.ts` | Brain Observatory frontend | typed Observatory models | Next.js Observatory | BFF reads -> deterministic UI state | structural verifier | frontend verify + visual evidence | source parity and responsive root render | OBSERVATORY_STRUCTURAL_VERIFICATION | HOLD |
          | `apps/observatory/src/app/api/brain/[...path]/route.ts`; `apps/observatory/src/lib/brain-upstream.ts` | browser-safe BFF | allowlisted proxy contract | Next.js route handler | request -> OIDC/key -> Railway -> no-store response | structural verifier | frontend verify + production read audit | fail-closed auth and no secret exposure | OBSERVATORY_BFF_IDENTITY_VERIFIED | HOLD |
          EOF

          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('docs/control/policy-registry.json')
          policy = json.loads(path.read_text())
          for item in [
              'docs/control/OBSERVATORY_CONSOLIDATION_PROVENANCE.md',
              'docs/control/source-requirement-registry.observatory.json',
              'docs/control/module-build-ready-traceability.observatory.md',
          ]:
              if item not in policy['required_control_files']:
                  policy['required_control_files'].append(item)
          reg = 'docs/control/source-requirement-registry.observatory.json'
          if reg not in policy['traceability_policy']['canonical_registry_extensions']:
              policy['traceability_policy']['canonical_registry_extensions'].append(reg)
          matrix = 'docs/control/module-build-ready-traceability.observatory.md'
          if matrix not in policy['traceability_policy']['canonical_module_matrix_extensions']:
              policy['traceability_policy']['canonical_module_matrix_extensions'].append(matrix)
          workflow = '.github/workflows/observatory-verify.yml'
          if workflow not in policy['required_workflows']:
              policy['required_workflows'].append(workflow)
          path.write_text(json.dumps(policy, indent=2) + '\n')
          PY

      - name: Add Observatory build to protected Brain test job
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/test.yml')
          text = path.read_text()
          node_marker = "      - uses: actions/setup-node@v4\n        with:\n          node-version: '22'\n"
          if node_marker not in text:
              py_setup = "      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n"
              if py_setup not in text:
                  raise SystemExit('setup-python marker not found')
              text = text.replace(py_setup, py_setup + node_marker, 1)
          obs_steps = """      - name: Install Brain Observatory dependencies\n        working-directory: apps/observatory\n        run: npm install --no-audit --no-fund\n      - name: Verify Brain Observatory\n        working-directory: apps/observatory\n        run: npm run verify\n"""
          if 'Verify Brain Observatory' not in text:
              lint = "      - name: Lint\n        run: ruff check --select E4,E7,E9,F .\n"
              if lint not in text:
                  raise SystemExit('lint marker not found')
              text = text.replace(lint, lint + obs_steps, 1)
          path.write_text(text)
          PY

      - name: Verify consolidated candidate before committing
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_control_layer.py
          python scripts/validate_build_ready_traceability.py
          npm --prefix apps/observatory install --no-audit --no-fund
          npm --prefix apps/observatory run verify
          git diff --check
          test -f apps/observatory/src/components/observatory/BrainObservatory.tsx
          test -f apps/observatory/src/app/api/brain/'[...path]'/route.ts
          test -f docs/observatory/PRODUCTION_WIRING.md
          if grep -R --line-number --exclude='OBSERVATORY_CONSOLIDATION_PROVENANCE.md' 'brain-control-plane' apps/observatory docs/observatory .github/workflows/observatory-verify.yml; then
            echo 'Unexpected active split-repository reference remains'
            exit 1
          fi

      - name: Commit canonical consolidation and remove migration helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/consolidate-observatory.yml
          git add -A
          git status --short
          git config user.name 'Harbourview Consolidation Bot'
          git config user.email 'harbourviewcompany@gmail.com'
          git commit -m 'feat(observatory): consolidate frontend and BFF into Brain'
          git push origin HEAD:consolidate/observatory-into-brain-20260826
