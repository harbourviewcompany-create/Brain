name: Verify Observatory Edges Production

on:
  workflow_dispatch:
    inputs:
      app_base_url:
        description: >-
          Base URL of the deployed Observatory. The former default,
          thebrain-sandy.vercel.app, is not a domain of the repository's Vercel
          project (prj_Fr14GlGBNeae7coqrnhgXteHC0jA) and no longer resolves.
        required: false
        default: https://brain-harbourview.vercel.app

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify all production BFF reads and Railway auth boundary
        shell: bash
        env:
          OBSERVATORY_ACCESS_KEY: ${{ secrets.OBSERVATORY_ACCESS_KEY }}
        run: |
          set -euo pipefail
          app="${{ inputs.app_base_url }}"
          brain="https://brain-api-live-production.up.railway.app"
          mkdir -p /tmp/brain-bff-envelopes evidence

          # The Observatory requires a signed operator session on every route,
          # so these probes must sign in first. `curl --fail` exits on the first
          # HTTP error, so without a session every audit stopped at its first
          # BFF probe instead of verifying production.
          if [ -z "${OBSERVATORY_ACCESS_KEY:-}" ]; then
            echo "OBSERVATORY_ACCESS_KEY is required to audit the protected BFF." >&2
            echo "Add it as a repository secret and re-run this workflow." >&2
            exit 1
          fi
          curl --silent --show-error --fail \
            -X POST "$app/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"access_key\":\"${OBSERVATORY_ACCESS_KEY}\"}" \
            -c /tmp/operator-cookies.txt -o /dev/null
          auth=(--cookie /tmp/operator-cookies.txt)

          routes=(
            health
            signals
            edges
            beliefs
            predictions
            contradictions
            opportunities
            curiosity
            sources
            outcomes
            approvals
            runner/status
            organism/cockpit
            organism/self-state
            organism/curiosity
            organism/agency-actions
            organism/quarantine
            organism/persistence/status
          )
          for route in "${routes[@]}"; do
            slug="${route//\//__}"
            code=$(curl --retry 4 --retry-all-errors --retry-delay 2 \
              --silent --show-error -o "/tmp/brain-bff-envelopes/${slug}.json" \
              -w '%{http_code}' "${auth[@]}" "$app/api/brain/$route")
            test "$code" = "200" || {
              echo "BFF $route returned $code" >&2
              cat "/tmp/brain-bff-envelopes/${slug}.json" >&2 || true
              exit 1
            }
            printf '%s 200\n' "$route"
          done

          railway_health=$(curl --retry 4 --retry-all-errors --retry-delay 2 --silent --show-error -o /tmp/railway-health.json -w '%{http_code}' "$brain/health")
          railway_edges=$(curl --retry 4 --retry-all-errors --retry-delay 2 --silent --show-error -o /tmp/railway-edges.json -w '%{http_code}' "$brain/edges")
          railway_signals=$(curl --retry 4 --retry-all-errors --retry-delay 2 --silent --show-error -o /tmp/railway-signals.json -w '%{http_code}' "$brain/signals")
          test "$railway_health" = "200"
          test "$railway_edges" = "401"
          test "$railway_signals" = "401"

          node - <<'NODE'
          const fs = require('fs');
          const routes = [
            'health',
            'signals',
            'edges',
            'beliefs',
            'predictions',
            'contradictions',
            'opportunities',
            'curiosity',
            'sources',
            'outcomes',
            'approvals',
            'runner/status',
            'organism/cockpit',
            'organism/self-state',
            'organism/curiosity',
            'organism/agency-actions',
            'organism/quarantine',
            'organism/persistence/status',
          ];
          const read = route => JSON.parse(fs.readFileSync(
            `/tmp/brain-bff-envelopes/${route.replaceAll('/', '__')}.json`,
            'utf8'
          ));
          const envelopes = routes.map(route => {
            const payload = read(route);
            if (payload && typeof payload === 'object' && typeof payload.detail === 'string') {
              throw new Error(`${route} returned error envelope detail=${payload.detail}`);
            }
            const descriptor = {
              route,
              http_status: 200,
              type: Array.isArray(payload) ? 'array' : typeof payload,
            };
            if (Array.isArray(payload)) {
              descriptor.length = payload.length;
            } else if (payload && typeof payload === 'object') {
              descriptor.keys = Object.keys(payload).sort();
              descriptor.array_lengths = Object.fromEntries(
                Object.entries(payload)
                  .filter(([, value]) => Array.isArray(value))
                  .map(([key, value]) => [key, value.length])
              );
              for (const key of ['status', 'database', 'persistence', 'total', 'version']) {
                const value = payload[key];
                if (['string', 'number', 'boolean'].includes(typeof value)) {
                  descriptor[key] = value;
                }
              }
            }
            return descriptor;
          });
          if (envelopes.length !== 18) throw new Error(`expected 18 envelopes, got ${envelopes.length}`);

          const health = read('health');
          const signals = read('signals');
          const organism = read('organism/cockpit');
          const edges = read('edges');
          const railwayEdges = JSON.parse(fs.readFileSync('/tmp/railway-edges.json','utf8'));
          const railwaySignals = JSON.parse(fs.readFileSync('/tmp/railway-signals.json','utf8'));
          if (health.status !== 'ok') throw new Error(`health=${health.status}`);
          if (health.database !== 'connected') throw new Error(`database=${health.database}`);
          if (health.persistence !== 'postgres') throw new Error(`persistence=${health.persistence}`);
          if (!Array.isArray(signals.items)) throw new Error('signals.items missing');
          if (!organism || typeof organism !== 'object') throw new Error('organism payload missing');
          if (!Array.isArray(edges.items)) throw new Error('edges.items missing');
          if (edges.total !== edges.items.length) throw new Error(`edge total mismatch ${edges.total} != ${edges.items.length}`);
          if (railwayEdges.detail !== 'invalid_or_missing_api_key') throw new Error(`Railway edges auth=${JSON.stringify(railwayEdges)}`);
          if (railwaySignals.detail !== 'invalid_or_missing_api_key') throw new Error(`Railway signals auth=${JSON.stringify(railwaySignals)}`);

          const evidence = {
            bff: {
              authenticated_surface_count: envelopes.length,
              envelopes,
              health: {
                status: health.status,
                version: health.version,
                database: health.database,
                persistence: health.persistence,
              },
            },
            railway_direct: {
              health: 200,
              edges: 401,
              signals: 401,
              edges_detail: railwayEdges.detail,
              signals_detail: railwaySignals.detail,
            },
          };
          fs.writeFileSync('evidence/bff-envelope-summary.json', JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence, null, 2));
          NODE

      - name: Install browser
        shell: bash
        working-directory: apps/observatory
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify live desktop and mobile Observatory
        env:
          APP_BASE_URL: ${{ inputs.app_base_url }}
        shell: bash
        working-directory: apps/observatory
        run: |
          set -euo pipefail
          mkdir -p evidence
          node - <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const reports = [];
            const failures = [];
            for (const spec of [
              {name: 'desktop', width: 1440, height: 1000},
              {name: 'mobile', width: 390, height: 844},
            ]) {
              const page = await browser.newPage({ viewport: { width: spec.width, height: spec.height } });
              const pageErrors = [];
              const edgeResponses = [];
              const serverErrors = [];
              const edgeConsole405 = [];

              page.on('pageerror', error => pageErrors.push(String(error)));
              page.on('console', msg => {
                if (msg.type() === 'error' && /405|edges/i.test(msg.text())) edgeConsole405.push(msg.text());
              });
              page.on('response', response => {
                const url = response.url();
                if (url.includes('/api/brain/edges')) edgeResponses.push({status: response.status(), url});
                if (response.status() >= 500) serverErrors.push(`${response.status()} ${url}`);
              });

              const root = await page.goto(process.env.APP_BASE_URL + '/', {waitUntil: 'domcontentloaded', timeout: 60000});
              if (!root || root.status() !== 200) failures.push(`${spec.name}: root ${root?.status()}`);
              await page.waitForTimeout(12500);

              const title = await page.title();
              const bodyText = await page.locator('body').innerText();
              const canvasCount = await page.locator('canvas').count();
              const dimensions = await page.evaluate(() => ({
                innerWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                scrollHeight: document.documentElement.scrollHeight,
              }));

              await page.screenshot({path: `evidence/production-${spec.name}.png`, fullPage: true});

              if (title !== 'Brain Observatory') failures.push(`${spec.name}: title=${JSON.stringify(title)}`);
              if (!/HEALTHY/i.test(bodyText)) failures.push(`${spec.name}: HEALTHY missing`);
              if (!/LIVE/i.test(bodyText)) failures.push(`${spec.name}: LIVE missing`);
              if (!/OBS\s+18\/18/i.test(bodyText)) failures.push(`${spec.name}: OBS 18/18 missing`);
              if (/\[object Object\]/.test(bodyText)) failures.push(`${spec.name}: [object Object] visible`);
              if (/\bDEGRADED\b/i.test(bodyText)) failures.push(`${spec.name}: DEGRADED visible`);
              if (canvasCount < 1) failures.push(`${spec.name}: canvas missing`);
              if (spec.name === 'mobile' && dimensions.scrollWidth > dimensions.innerWidth + 2) failures.push(`${spec.name}: horizontal overflow ${dimensions.scrollWidth}/${dimensions.innerWidth}`);
              if (pageErrors.length) failures.push(`${spec.name}: page errors ${JSON.stringify(pageErrors)}`);
              if (serverErrors.length) failures.push(`${spec.name}: 5xx ${JSON.stringify(serverErrors)}`);
              if (edgeConsole405.length) failures.push(`${spec.name}: edge/405 console errors ${JSON.stringify(edgeConsole405)}`);
              if (edgeResponses.length < 2) failures.push(`${spec.name}: expected >=2 edge polls, got ${edgeResponses.length}`);
              if (edgeResponses.some(item => item.status !== 200)) failures.push(`${spec.name}: edge responses ${JSON.stringify(edgeResponses)}`);

              reports.push({
                ...spec,
                title,
                canvasCount,
                dimensions,
                edgeResponses,
                edgeConsole405,
                pageErrors,
                serverErrors,
                obs18: /OBS\s+18\/18/i.test(bodyText),
                textSample: bodyText.slice(0, 2200),
              });
              await page.close();
            }
            await browser.close();
            fs.writeFileSync('evidence/production-edge-audit.json', JSON.stringify({reports, failures}, null, 2));
            console.log(JSON.stringify({reports, failures}, null, 2));
            if (failures.length) throw new Error(JSON.stringify(failures));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-edges-production-evidence
          path: |
            evidence/*
            apps/observatory/evidence/*
          if-no-files-found: error
          retention-days: 7
