name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Validate Brain agent-control artifacts
        run: python tools/validate_agent_control.py
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check .
