name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pip install -c constraints.txt -e '.[dev]'
      - name: Install Observatory dependencies
        working-directory: apps/observatory
        run: npm install --no-audit --no-fund
      - name: Validate Brain agent-control artifacts
        run: python tools/validate_agent_control.py
      - name: Validate MOD-008 through MOD-015 conformance
        run: python tools/validate_mod_008_015_conformance.py
      - name: Validate zero-cost runtime policy
        run: python scripts/validate_zero_cost_runtime.py
      - name: Compile Python sources
        run: python -m compileall -q api apps/api brain scripts tools tests
      - name: Targeted Turso and migration contracts
        run: pytest -q tests/test_turso_persistence.py tests/test_railway_turso_migration.py
      - name: Full test suite
        run: pytest -q
      - name: Ruff static checks
        run: ruff check --select E4,E7,E9,F .
      - name: Verify Observatory frontend
        working-directory: apps/observatory
        run: npm run verify

  zero-cost-migration-fixture:
    name: Zero-cost migration fixture
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain
          POSTGRES_DB: brain
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U brain -d brain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -c constraints.txt -e '.[dev]'
      - name: Seed deterministic PostgreSQL source fixture
        env:
          FIXTURE_DSN: postgresql://brain:brain@127.0.0.1:55433/brain
        run: |
          python - <<'PY'
          import os
          import psycopg

          dsn = os.environ['FIXTURE_DSN']
          events = [
              ('00000000-0000-0000-0000-000000000001','signal.enqueued','signal','00000000-0000-0000-0000-000000000101',None,'00000000-0000-0000-0000-000000000201','{"sequence":1}','2026-08-28T12:00:00+00:00'),
              ('00000000-0000-0000-0000-000000000002','belief.created','belief','00000000-0000-0000-0000-000000000102','00000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000201','{"sequence":2}','2026-08-28T12:00:01+00:00'),
              ('00000000-0000-0000-0000-000000000003','cycle.completed','cycle','00000000-0000-0000-0000-000000000103','00000000-0000-0000-0000-000000000002','00000000-0000-0000-0000-000000000201','{"sequence":3}','2026-08-28T12:00:02+00:00'),
          ]
          insert_sql = (
              'INSERT INTO public.brain_events('
              'id,event_type,aggregate_type,aggregate_id,causation_id,correlation_id,payload,occurred_at) '
              'VALUES (%s,%s,%s,%s,%s,%s,%s::jsonb,%s)'
          )
          with psycopg.connect(dsn) as conn:
              conn.execute(
                  'CREATE TABLE public.brain_events('
                  'id uuid PRIMARY KEY,'
                  'event_type text NOT NULL,'
                  'aggregate_type text NOT NULL,'
                  'aggregate_id uuid NOT NULL,'
                  'causation_id uuid,'
                  'correlation_id uuid,'
                  'payload jsonb NOT NULL,'
                  'occurred_at timestamptz NOT NULL)'
              )
              conn.execute('CREATE TABLE public.migration_fixture_notes(id text PRIMARY KEY,payload text NOT NULL)')
              for event in events:
                  conn.execute(insert_sql, event)
              conn.execute("INSERT INTO public.migration_fixture_notes VALUES ('fixture-1','complete-extra-table-row')")
          PY
      - name: Convert and verify deterministic PostgreSQL to SQLite fixture
        env:
          FIXTURE_DSN: postgresql://brain:brain@127.0.0.1:55433/brain
        run: |
          set -euo pipefail
          rm -rf migration-fixture-evidence /tmp/brain-zero-cost-fixture.sqlite
          mkdir -p migration-fixture-evidence
          python tools/railway_turso_migration.py convert \
            --postgres-dsn "$FIXTURE_DSN" \
            --sqlite /tmp/brain-zero-cost-fixture.sqlite \
            --evidence-dir migration-fixture-evidence
          python tools/verify_event_replay_equivalence.py \
            --postgres-dsn "$FIXTURE_DSN" \
            --sqlite /tmp/brain-zero-cost-fixture.sqlite \
            --output migration-fixture-evidence/replay_equivalence.json
          python tools/railway_turso_migration.py verify-sqlite \
            --sqlite /tmp/brain-zero-cost-fixture.sqlite \
            --evidence-dir migration-fixture-evidence/independent
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          evidence = Path('migration-fixture-evidence')
          sqlite_path = Path('/tmp/brain-zero-cost-fixture.sqlite')
          counts = json.loads((evidence / 'source_counts.json').read_text())
          migration = json.loads((evidence / 'migration_verification.json').read_text())
          replay = json.loads((evidence / 'replay_equivalence.json').read_text())
          independent = json.loads((evidence / 'independent/sqlite_full_verification.json').read_text())
          if counts.get('brain_events') != 3:
              raise SystemExit(f"expected 3 canonical events, got {counts.get('brain_events')}")
          if counts.get('migration_fixture_notes') != 1:
              raise SystemExit(f"expected 1 extra-table row, got {counts.get('migration_fixture_notes')}")
          if not migration.get('verified') or not replay.get('verified') or not independent.get('verified'):
              raise SystemExit('fixture migration/replay/independent verification did not all pass')
          digest = hashlib.sha256(sqlite_path.read_bytes()).hexdigest()
          summary = {
              'verified': True,
              'source_counts': counts,
              'source_table_count': migration['source_table_count'],
              'source_row_count': migration['source_row_count'],
              'event_replay_count': replay['source']['event_count'],
              'event_replay_sha256': replay['source']['sha256_replay'],
              'sqlite_sha256': digest,
              'sqlite_bytes': sqlite_path.stat().st_size,
              'independent_table_count': independent['table_count'],
              'independent_row_count': independent['row_count'],
          }
          (evidence / 'fixture-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Upload migration fixture evidence
        uses: actions/upload-artifact@v4
        with:
          name: migration-fixture-evidence
          path: migration-fixture-evidence/**
          if-no-files-found: error
          retention-days: 7

  container-integration:
    name: Production container persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create isolated Docker network
        run: docker network create brain-ci

      - name: Start PostgreSQL with pgvector
        run: |
          docker run -d --name brain-postgres --network brain-ci \
            -e POSTGRES_USER=brain \
            -e POSTGRES_PASSWORD=brain \
            -e POSTGRES_DB=brain \
            pgvector/pgvector:pg16
          for i in $(seq 1 60); do
            if docker exec -e PGPASSWORD=brain brain-postgres \
                 psql -h 127.0.0.1 -U brain -d brain -tAc 'select 1' >/dev/null 2>&1; then
              break
            fi
            if [ "${i}" = "60" ]; then docker logs brain-postgres; exit 1; fi
            sleep 1
          done
          docker exec -i brain-postgres psql -v ON_ERROR_STOP=1 -U brain -d brain <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          SQL

      - name: Apply pre-tenant baseline migrations through 018
        run: |
          for migration in $(find db/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            version=$(basename "${migration}" | cut -d_ -f1)
            if [ "$((10#${version}))" -gt 18 ]; then
              continue
            fi
            echo "Applying ${migration}"
            docker exec -i brain-postgres psql -v ON_ERROR_STOP=1 -U brain -d brain < "${migration}"
          done

      - name: Build production images
        run: |
          docker build -t brain-api-ci -f Dockerfile .
          docker build -t brain-worker-ci -f Dockerfile.worker .
          docker build -t brain-cockpit-ci -f Dockerfile.railway .

      - name: Verify production images run as non-root
        run: |
          for image in brain-api-ci brain-worker-ci brain-cockpit-ci; do
            uid=$(docker run --rm --entrypoint id "${image}" -u)
            if [ "${uid}" = "0" ]; then
              echo "${image} runs as root"
              exit 1
            fi
          done

      - name: Start production API
        run: |
          docker run -d --name brain-api --network brain-ci -p 8000:8000 \
            -e BRAIN_API_KEY=ci-test-key \
            -e BRAIN_CORS_ORIGINS=http://localhost:3000 \
            -e DATABASE_URL=postgresql://brain:brain@brain-postgres:5432/brain \
            brain-api-ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 1
          done
          docker logs brain-api
          exit 1

      - name: Verify authentication and durable belief round trip
        run: |
          test "$(curl -sS -o /tmp/unauthorized -w '%{http_code}' http://127.0.0.1:8000/beliefs)" = "401"
          create_response=$(curl -fsS -X POST http://127.0.0.1:8000/beliefs \
            -H 'Content-Type: application/json' \
            -H 'X-Brain-Api-Key: ci-test-key' \
            -d '{"statement":"container persistence evidence","confidence":0.8}')
          belief_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"${create_response}")
          docker rm -f brain-api
          docker run -d --name brain-api --network brain-ci -p 8000:8000 \
            -e BRAIN_API_KEY=ci-test-key \
            -e BRAIN_CORS_ORIGINS=http://localhost:3000 \
            -e DATABASE_URL=postgresql://brain:brain@brain-postgres:5432/brain \
            brain-api-ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:8000/beliefs/${belief_id}" \
            -H 'X-Brain-Api-Key: ci-test-key' | grep -q 'container persistence evidence'

      - name: Verify readiness fails when database disappears
        run: |
          docker stop brain-postgres
          for i in $(seq 1 20); do
            code=$(curl -sS -o /tmp/readiness -w '%{http_code}' http://127.0.0.1:8000/ready || true)
            if [ "${code}" = "503" ]; then exit 0; fi
            sleep 1
          done
          cat /tmp/readiness || true
          docker logs brain-api
          exit 1

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs brain-api || true
          docker logs brain-postgres || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f brain-api brain-postgres >/dev/null 2>&1 || true
          docker network rm brain-ci >/dev/null 2>&1 || true

  tenant-rls-integration:
    name: Tenant RLS release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -c constraints.txt -e '.[dev]'

      - name: Create isolated Docker network
        run: docker network create brain-tenant-ci

      - name: Start PostgreSQL and constrained runtime identities
        run: |
          docker run -d --name brain-tenant-postgres --network brain-tenant-ci -p 55432:5432 \
            -e POSTGRES_USER=brain \
            -e POSTGRES_PASSWORD=brain \
            -e POSTGRES_DB=brain \
            pgvector/pgvector:pg16
          for i in $(seq 1 60); do
            if docker exec -e PGPASSWORD=brain brain-tenant-postgres \
                 psql -h 127.0.0.1 -U brain -d brain -tAc 'select 1' >/dev/null 2>&1; then
              break
            fi
            if [ "${i}" = "60" ]; then docker logs brain-tenant-postgres; exit 1; fi
            sleep 1
          done
          docker exec -i brain-tenant-postgres psql -v ON_ERROR_STOP=1 -U brain -d brain <<'SQL'
          create role brain_api_ci login password 'brain-api-ci';
          create role brain_worker_ci login password 'brain-worker-ci';
          SQL

      - name: Build exact production baseline through migration 018
        env:
          BRAIN_MIGRATION_DATABASE_URL: postgresql://brain:brain@127.0.0.1:55432/brain
        run: python tools/apply_migrations.py --max-version 18

      - name: Seed one pre-tenant legacy row
        run: |
          docker exec -i brain-tenant-postgres psql -v ON_ERROR_STOP=1 -U brain -d brain <<'SQL'
          insert into public.brain_events (
            id, event_type, aggregate_type, aggregate_id, payload
          ) values (
            'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa0',
            'legacy.pre_tenant',
            'tenant_rls_test',
            'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa7',
            '{"legacy":true}'::jsonb
          );
          SQL

      - name: Prove tenant migrations fail closed without release gates
        env:
          BRAIN_MIGRATION_DATABASE_URL: postgresql://brain:brain@127.0.0.1:55432/brain
          DATABASE_URL: postgresql://brain_api_ci:brain-api-ci@127.0.0.1:55432/brain
        run: |
          set +e
          python tools/apply_migrations.py >/tmp/tenant-release-denied.log 2>&1
          status=$?
          set -e
          cat /tmp/tenant-release-denied.log
          test "${status}" -ne 0
          grep -q 'BRAIN_TENANT_RLS_RELEASE=1' /tmp/tenant-release-denied.log
          applied_019=$(docker exec brain-tenant-postgres psql -At -U brain -d brain -c "select count(*) from public.brain_schema_migrations where filename = '019_tenant_auth_foundation.sql'")
          test "${applied_019}" = "0"

      - name: Apply tenant migrations with explicit safe topology
        env:
          BRAIN_MIGRATION_DATABASE_URL: postgresql://brain:brain@127.0.0.1:55432/brain
          DATABASE_URL: postgresql://brain_api_ci:brain-api-ci@127.0.0.1:55432/brain
          BRAIN_WORKER_DATABASE_URL: postgresql://brain_worker_ci:brain-worker-ci@127.0.0.1:55432/brain
          BRAIN_TENANT_RLS_RELEASE: '1'
          BRAIN_TENANT_MODE: required
          BRAIN_TENANT_CONTEXT_SECRET: ci-only-tenant-signing-fixture
        run: python tools/apply_migrations.py

      - name: Prove canonical migration idempotence and hashes
        env:
          BRAIN_MIGRATION_DATABASE_URL: postgresql://brain:brain@127.0.0.1:55432/brain
          DATABASE_URL: postgresql://brain_api_ci:brain-api-ci@127.0.0.1:55432/brain
          BRAIN_WORKER_DATABASE_URL: postgresql://brain_worker_ci:brain-worker-ci@127.0.0.1:55432/brain
          BRAIN_TENANT_RLS_RELEASE: '1'
          BRAIN_TENANT_MODE: required
          BRAIN_TENANT_CONTEXT_SECRET: ci-only-tenant-signing-fixture
        run: |
          python tools/apply_migrations.py
          python tools/verify_tenant_rls_release.py

      - name: Build tenant-aware production images
        run: |
          docker build -t brain-api-tenant-ci -f Dockerfile .
          docker build -t brain-worker-tenant-ci -f Dockerfile.worker .
          docker build -t brain-cockpit-tenant-ci -f Dockerfile.railway .

      - name: Verify worker requires the audited trusted-service login
        run: |
          docker run --rm --network brain-tenant-ci \
            -e DATABASE_URL=postgresql://brain_api_ci:brain-api-ci@brain-tenant-postgres:5432/brain \
            -e BRAIN_WORKER_DATABASE_URL=postgresql://brain_worker_ci:brain-worker-ci@brain-tenant-postgres:5432/brain \
            -e BRAIN_WORKER_MODE=verify \
            brain-worker-tenant-ci

          set +e
          docker run --rm --network brain-tenant-ci \
            -e DATABASE_URL=postgresql://brain_api_ci:brain-api-ci@brain-tenant-postgres:5432/brain \
            -e BRAIN_WORKER_MODE=verify \
            brain-worker-tenant-ci >/tmp/unsafe-worker.log 2>&1
          status=$?
          set -e
          cat /tmp/unsafe-worker.log
          test "${status}" -ne 0
          grep -q 'BRAIN_WORKER_DATABASE_URL is required' /tmp/unsafe-worker.log

      - name: Start Railway-compatible cockpit on tenant-aware boundary
        run: |
          docker run -d --name brain-tenant-cockpit --network brain-tenant-ci -p 8001:8000 \
            -e PORT=8000 \
            -e BRAIN_API_KEY=ci-test-key \
            -e BRAIN_CORS_ORIGINS=http://localhost:3000 \
            -e BRAIN_TENANT_MODE=required \
            -e BRAIN_TENANT_CONTEXT_SECRET=ci-only-tenant-signing-fixture \
            -e DATABASE_URL=postgresql://brain_api_ci:brain-api-ci@brain-tenant-postgres:5432/brain \
            brain-cockpit-tenant-ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/health; then break; fi
            if [ "${i}" = "30" ]; then docker logs brain-tenant-cockpit; exit 1; fi
            sleep 1
          done

      - name: Preserve authenticated #141 edge read through tenant boundary
        run: |
          tenant_id='aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa1'
          actor_id='tenant-a-operator'
          timestamp=$(date +%s)
          signature=$(TENANT_ID="${tenant_id}" ACTOR_ID="${actor_id}" TS="${timestamp}" python - <<'PY'
          import hashlib, hmac, os
          message = f"{os.environ['TENANT_ID']}\n{os.environ['ACTOR_ID']}\n{os.environ['TS']}".encode()
          print(hmac.new(b"ci-only-tenant-signing-fixture", message, hashlib.sha256).hexdigest())
          PY
          )
          curl -fsS http://127.0.0.1:8001/edges \
            -H 'X-Brain-Api-Key: ci-test-key' \
            -H "X-Brain-Tenant-Id: ${tenant_id}" \
            -H "X-Brain-Actor-Id: ${actor_id}" \
            -H "X-Brain-Tenant-Timestamp: ${timestamp}" \
            -H "X-Brain-Tenant-Signature: ${signature}" \
            | python -c 'import json,sys; p=json.load(sys.stdin); assert p["source"] == "api"'

      - name: Tenant-RLS logs on failure
        if: failure()
        run: |
          docker logs brain-tenant-cockpit || true
          docker logs brain-tenant-postgres || true

      - name: Cleanup tenant-RLS environment
        if: always()
        run: |
          docker rm -f brain-tenant-cockpit brain-tenant-postgres >/dev/null 2>&1 || true
          docker network rm brain-tenant-ci >/dev/null 2>&1 || true
