name: Zero Cost CI Finalize

on:
  push:
    branches:
      - feat/zero-cost-runtime

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/zero-cost-runtime
          fetch-depth: 0
      - name: Apply protected CI patch
        run: python tools/_zero_cost_ci_patch.py
      - name: Remove temporary patch machinery
        run: rm tools/_zero_cost_ci_patch.py .github/workflows/zero-cost-ci-finalize.yml
      - name: Commit protected CI
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/test.yml tools/_zero_cost_ci_patch.py .github/workflows/zero-cost-ci-finalize.yml
          git commit -m 'ci(zero-cost): require migration fixture and runtime gates'
          git push origin HEAD:feat/zero-cost-runtime
