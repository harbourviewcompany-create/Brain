name: Brain Control Policy

on:
  # validate_pr_body.py reads the body out of the event payload, so a body that
  # violates the control template can only be fixed by editing it -- and the
  # default activity types (opened, synchronize, reopened) never re-run on an
  # edit. Without `edited` the check stays red until an unrelated push happens
  # to re-trigger it, which is exactly the empty-commit-to-kick-CI habit the
  # build rules forbid.
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches:
      - main
      - control/enforce-agent-build-rules
      - traceability/deep-source-module-mapping
      - control/repository-hardening-audit

jobs:
  control-policy:
    name: Validate Brain control policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile validator scripts
        run: |
          python -m py_compile scripts/validate_control_layer.py scripts/validate_archive_manifest.py scripts/validate_pr_body.py scripts/validate_build_ready_traceability.py tools/check_repository_hardening.py scripts/ingest_current_thread_archive.py

      - name: Validate control layer
        run: |
          python scripts/validate_control_layer.py

      - name: Validate archive manifest
        run: |
          python scripts/validate_archive_manifest.py

      - name: Validate module BUILD-READY traceability
        run: |
          python scripts/validate_build_ready_traceability.py

      - name: Validate pull request body
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python scripts/validate_pr_body.py
