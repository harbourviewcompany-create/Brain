name: Brain Observatory Verify

on:
  pull_request:
    paths:
      - "apps/observatory/src/**"
      - "apps/observatory/scripts/verify-observatory.mjs"
      - "apps/observatory/package.json"
      - "apps/observatory/package-lock.json"
      - "apps/observatory/eslint.config.mjs"
      - "apps/observatory/tailwind.config.ts"
      - "docs/observatory/BRAIN_OBSERVATORY.md"
      - ".github/workflows/observatory-verify.yml"
      - ".github/workflows/test.yml"
      - "docs/control/policy-registry.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: apps/observatory
        run: npm install --no-audit --no-fund
      - name: Lint
        working-directory: apps/observatory
        run: npm run lint
      - name: Typecheck
        working-directory: apps/observatory
        run: npm run typecheck
      - name: Observatory structural tests
        working-directory: apps/observatory
        run: npm run test:observatory
      - name: Production build
        working-directory: apps/observatory
        run: npm run build
      - name: Verify BFF boundary and render visual evidence
        shell: bash
        working-directory: apps/observatory
        env:
          # Deliberately unreachable. This job verifies the BFF *boundary*
          # -- who may reach the proxy and which paths it forwards -- which
          # needs no real upstream. Reading live Brain data requires real
          # credentials and belongs in the workflow_dispatch production
          # audits, not in a gate every pull request must pass.
          BRAIN_API_URL: https://upstream.invalid/api/brain
          BRAIN_API_KEY: ci-visual-evidence-proxy
          # The Observatory now requires a signed operator session on every
          # route. These are CI-only fixtures, like BRAIN_API_KEY above; without
          # them the app fails closed and this step would screenshot the login
          # page instead of the cockpit.
          OBSERVATORY_ACCESS_KEY: ci-visual-evidence-operator-key
          OBSERVATORY_SESSION_SECRET: ci-visual-evidence-session-secret
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm run start -- -H 127.0.0.1 -p 3000 >/tmp/brain-observatory-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT

          # /login is the readiness signal: it is the one route reachable
          # without a session, so it proves the server is serving without
          # depending on authentication or on the upstream Brain being up.
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/brain-observatory-next.log
            exit 1
          fi

          # Sign in through the real login route and hand the resulting session
          # to Playwright. This also proves the operator auth path works end to
          # end on every run.
          node scripts/ci-operator-storage-state.mjs \
            http://127.0.0.1:3000 \
            /tmp/brain-operator-state.json

          # BFF boundary smoke. The proxy attaches the server-side Brain API key
          # to everything it forwards, so these three properties are what stop it
          # being an open relay.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/brain/health)
          test "$code" = "401" || { echo "unauthenticated BFF returned $code, expected 401"; exit 1; }

          cookie=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/brain-operator-state.json','utf8')).cookies[0].value)")

          code=$(curl -s -o /dev/null -w '%{http_code}' -b "brain_operator=$cookie" http://127.0.0.1:3000/api/brain/health)
          test "$code" != "401" || { echo "authenticated BFF still returned 401"; exit 1; }

          body=$(curl -s -b "brain_operator=$cookie" http://127.0.0.1:3000/api/brain/not-an-allowed-path)
          echo "$body" | grep -q 'path_not_allowed' || { echo "allowlist did not reject an unlisted path: $body"; exit 1; }

          echo "BFF boundary: unauthenticated 401, authenticated reaches proxy, allowlist enforced"

          npx --yes playwright@1.55.0 install --with-deps chromium
          npx --yes playwright@1.55.0 screenshot \
            --browser chromium \
            --viewport-size="1440,1000" \
            --wait-for-timeout=10000 \
            --load-storage=/tmp/brain-operator-state.json \
            http://127.0.0.1:3000 \
            evidence/brain-observatory-desktop.png
          npx --yes playwright@1.55.0 screenshot \
            --browser chromium \
            --viewport-size="390,844" \
            --wait-for-timeout=10000 \
            --load-storage=/tmp/brain-operator-state.json \
            http://127.0.0.1:3000 \
            evidence/brain-observatory-mobile.png

          test -s evidence/brain-observatory-desktop.png
          test -s evidence/brain-observatory-mobile.png
          file evidence/*.png
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: brain-observatory-visual-evidence
          path: apps/observatory/evidence/*.png
          if-no-files-found: error
          retention-days: 7
