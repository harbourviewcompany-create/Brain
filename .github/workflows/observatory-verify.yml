name: Brain Observatory Verify

on:
  pull_request:
    paths:
      - "apps/observatory/src/**"
      - "apps/observatory/scripts/verify-observatory.mjs"
      - "apps/observatory/package.json"
      - "apps/observatory/package-lock.json"
      - "apps/observatory/eslint.config.mjs"
      - "apps/observatory/tailwind.config.ts"
      - "docs/observatory/BRAIN_OBSERVATORY.md"
      - "docs/observatory/LIVING_COGNITIVE_MACHINE.md"
      - ".github/workflows/observatory-verify.yml"
      - ".github/workflows/test.yml"
      - "docs/control/policy-registry.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: apps/observatory
        run: npm install --no-audit --no-fund
      - name: Lint
        working-directory: apps/observatory
        run: npm run lint
      - name: Typecheck
        working-directory: apps/observatory
        run: npm run typecheck
      - name: Observatory structural tests
        working-directory: apps/observatory
        run: npm run test:observatory
      - name: Production build
        working-directory: apps/observatory
        run: npm run build
      - name: Render desktop, tablet and mobile visual evidence
        shell: bash
        working-directory: apps/observatory
        env:
          BRAIN_API_URL: https://brain-api-live-production.up.railway.app
          BRAIN_API_KEY: ci-visual-evidence-proxy
          # Optional gate ON in CI so we still exercise session login when secrets exist.
          OBSERVATORY_ACCESS_KEY: ci-visual-evidence-operator-key
          OBSERVATORY_SESSION_SECRET: ci-visual-evidence-session-secret
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm run start -- -H 127.0.0.1 -p 3000 >/tmp/brain-observatory-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/brain-observatory-next.log
            exit 1
          fi

          node scripts/ci-operator-storage-state.mjs \
            http://127.0.0.1:3000 \
            /tmp/brain-operator-state.json

          # With secrets set, unauthenticated BFF must still 401.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/brain/health)
          test "$code" = "401" || { echo "unauthenticated BFF returned $code, expected 401"; exit 1; }

          cookie=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/brain-operator-state.json','utf8')).cookies[0].value)")

          code=$(curl -s -o /dev/null -w '%{http_code}' -b "brain_operator=$cookie" http://127.0.0.1:3000/api/brain/health)
          test "$code" != "401" || { echo "authenticated BFF still returned 401"; exit 1; }

          body=$(curl -s -b "brain_operator=$cookie" http://127.0.0.1:3000/api/brain/not-an-allowed-path)
          echo "$body" | grep -q 'path_not_allowed' || { echo "allowlist did not reject an unlisted path: $body"; exit 1; }

          echo "BFF boundary: unauthenticated 401, authenticated reaches proxy, allowlist enforced"

          npx --yes playwright@1.55.0 install --with-deps chromium
          npx --yes playwright@1.55.0 screenshot \
            --browser chromium \
            --viewport-size="1440,1000" \
            --wait-for-timeout=10000 \
            --load-storage=/tmp/brain-operator-state.json \
            http://127.0.0.1:3000 \
            evidence/brain-observatory-desktop.png
          npx --yes playwright@1.55.0 screenshot \
            --browser chromium \
            --viewport-size="1024,1366" \
            --wait-for-timeout=10000 \
            --load-storage=/tmp/brain-operator-state.json \
            http://127.0.0.1:3000 \
            evidence/brain-observatory-tablet.png
          npx --yes playwright@1.55.0 screenshot \
            --browser chromium \
            --viewport-size="390,844" \
            --wait-for-timeout=10000 \
            --load-storage=/tmp/brain-operator-state.json \
            http://127.0.0.1:3000 \
            evidence/brain-observatory-mobile.png

          test -s evidence/brain-observatory-desktop.png
          test -s evidence/brain-observatory-tablet.png
          test -s evidence/brain-observatory-mobile.png
          file evidence/*.png
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: brain-observatory-visual-evidence
          path: apps/observatory/evidence/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Existing production BFF diagnostic
        id: production_baseline
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # PR builds cannot require an already-deployed production backend to
          # contain the code being proposed by the PR. This remains a visible
          # diagnostic here. The hard production release assertion lives in
          # `.github/workflows/postdeploy-observatory-audit.yml`, which fails on
          # an unhealthy BFF, `/signals`, Railway auth, or live browser errors.
          # Bound every diagnostic request so an unhealthy live service cannot
          # consume the PR job's full timeout while still preserving visibility.
          base="https://brain-seven-puce.vercel.app/api/brain"
          health_code="$(curl --connect-timeout 3 --max-time 10 --retry 1 --retry-all-errors --retry-delay 1 --retry-max-time 12 --silent --show-error \
            -o /tmp/health.json -w "%{http_code}" "$base/health" || true)"
          signals_code="$(curl --connect-timeout 3 --max-time 10 --retry 1 --retry-all-errors --retry-delay 1 --retry-max-time 12 --silent --show-error \
            -o /tmp/signals.json -w "%{http_code}" "$base/signals" || true)"
          organism_code="$(curl --connect-timeout 3 --max-time 10 --retry 1 --retry-all-errors --retry-delay 1 --retry-max-time 12 --silent --show-error \
            -o /tmp/organism.json -w "%{http_code}" "$base/organism/cockpit" || true)"
          node - <<NODE
          const fs = require('fs');
          const healthCode = "${health_code}";
          let health = { status: null, version: null, database: null, persistence: null, heartbeat: null };
          if (healthCode === '200') {
            health = JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
            if (health.status !== 'ok') throw new Error(\`health status \${health.status}\`);
          } else if (healthCode !== '401' && healthCode !== '503') {
            throw new Error(\`unexpected health status \${healthCode}\`);
          }

          const signalsCode = "${signals_code}";
          let signalsCount = null;
          if (signalsCode === '200') {
            const signals = JSON.parse(fs.readFileSync('/tmp/signals.json','utf8'));
            if (!Array.isArray(signals.items)) throw new Error('signals.items missing');
            signalsCount = signals.items.length;
          } else if (signalsCode !== '401' && signalsCode !== '404' && signalsCode !== '503') {
            throw new Error(\`unexpected signals status \${signalsCode}\`);
          }

          const organismCode = "${organism_code}";
          let organismKeys = [];
          if (organismCode === '200') {
            const organism = JSON.parse(fs.readFileSync('/tmp/organism.json','utf8'));
            if (!organism || typeof organism !== 'object') throw new Error('organism payload missing');
            organismKeys = Object.keys(organism).sort();
          } else if (organismCode !== '404' && organismCode !== '401' && organismCode !== '503') {
            throw new Error(\`unexpected organism cockpit status \${organismCode}\`);
          }

          console.log(JSON.stringify({
            health: { code: healthCode, status: health.status, version: health.version, database: health.database, persistence: health.persistence, heartbeat: health.heartbeat },
            signals: { status: signalsCode, count: signalsCount },
            organism: { status: organismCode, keys: organismKeys }
          }, null, 2));
          NODE
      - name: Record production baseline diagnostic
        if: always()
        shell: bash
        run: |
          echo "### Existing production baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "PR verification: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Production diagnostic outcome: ${{ steps.production_baseline.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Hard production verification remains Postdeploy Observatory Audit after deployment." >> "$GITHUB_STEP_SUMMARY"
