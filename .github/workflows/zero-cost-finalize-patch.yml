name: Zero Cost Finalize Patch

on:
  push:
    branches:
      - feat/zero-cost-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/zero-cost-runtime
          fetch-depth: 0
      - name: Apply exact migration hardening
        shell: bash
