name: Zero Cost Finalize Patch

on:
  push:
    branches:
      - feat/zero-cost-runtime

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/zero-cost-runtime
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python tools/_zero_cost_finalize_patch.py
      - name: Remove temporary patch machinery
        run: rm tools/_zero_cost_finalize_patch.py .github/workflows/zero-cost-finalize-patch.yml
      - name: Commit hardened source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/railway_turso_migration.py tools/_zero_cost_finalize_patch.py .github/workflows/zero-cost-finalize-patch.yml
          git commit -m 'fix(zero-cost): harden migration normalization and source reads'
          git push origin HEAD:feat/zero-cost-runtime
