name: Zero-Cost Brain Maintenance

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-zero-cost-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      BRAIN_STORAGE_BACKEND: turso
      BRAIN_INLINE_COGNITION: '0'
      BRAIN_MAINTENANCE_MAX_ITEMS: '10'
      BRAIN_MAINTENANCE_MAX_EVENTS: '1000'
      BRAIN_MAINTENANCE_REPORT: evidence/zero-cost-maintenance.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: pip install -c constraints.txt -e '.[dev]'

      - name: Validate zero-cost policy
        run: python scripts/validate_zero_cost_runtime.py

      # The destination is not configured until the production cutover happens.
      # Until then this job has nothing to maintain, and failing hourly would
      # make a permanent red that trains every reader to ignore this signal.
      # A half-configured destination is a different thing entirely -- that is a
      # real misconfiguration and still fails loudly.
      - name: Resolve free Turso destination
        id: destination
        shell: bash
        run: |
          set -euo pipefail
          url="${TURSO_DATABASE_URL:-}"
          token="${TURSO_AUTH_TOKEN:-}"
          if [ -z "${url}" ] && [ -z "${token}" ]; then
            echo 'configured=false' >> "${GITHUB_OUTPUT}"
            echo 'Turso destination is not configured yet; maintenance has nothing to run against.'
            echo 'Set the TURSO_DATABASE_URL and TURSO_AUTH_TOKEN secrets at production cutover.'
            exit 0
          fi
          test -n "${url}" || { echo 'TURSO_AUTH_TOKEN is set but TURSO_DATABASE_URL is missing'; exit 1; }
          test -n "${token}" || { echo 'TURSO_DATABASE_URL is set but TURSO_AUTH_TOKEN is missing'; exit 1; }
          case "${url}" in
            libsql://*|https://*) ;;
            *) echo 'TURSO_DATABASE_URL must reference an existing remote libSQL/Turso database'; exit 1 ;;
          esac
          echo 'configured=true' >> "${GITHUB_OUTPUT}"

      - name: Run bounded idempotent maintenance
        if: steps.destination.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python tools/zero_cost_maintenance.py

      - name: Upload maintenance evidence
        if: always() && steps.destination.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zero-cost-maintenance-${{ github.run_id }}
          path: evidence/zero-cost-maintenance.json
          if-no-files-found: warn
          retention-days: 14
