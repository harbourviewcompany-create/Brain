name: Consolidate Observatory Into Brain V4

on:
  push:
    branches:
      - consolidate/observatory-into-brain-20260826
    paths:
      - .github/workflows/consolidate-observatory-v4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidate/observatory-into-brain-20260826
          fetch-depth: 0
          persist-credentials: true
      - name: Generate, validate, and push non-workflow consolidation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          recipe = Path('.github/workflows/consolidate-observatory.yml').read_text()
          recipe = recipe.replace(
              "grep -R --line-number --exclude='OBSERVATORY_CONSOLIDATION_PROVENANCE.md' 'brain-control-plane' apps/observatory docs/observatory .github/workflows/observatory-verify.yml",
              "grep -R --line-number 'brain-control-plane' apps/observatory/src .github/workflows/observatory-verify.yml"
          )
          data = yaml.safe_load(recipe)
          stop_before = 'Commit canonical consolidation and remove migration helper'
          for step in data['jobs']['consolidate']['steps']:
              name = step.get('name', '')
              if name == stop_before:
                  break
              command = step.get('run')
              if not command:
                  continue
              print(f'::group::{name}', flush=True)
              result = subprocess.run(
                  ['bash', '--noprofile', '--norc', '-e', '-o', 'pipefail', '-c', command],
                  cwd='.',
                  text=True,
              )
              print('::endgroup::', flush=True)
              if result.returncode:
                  raise SystemExit(result.returncode)
          PY

          # The generated full tree is validated above. GitHub's workflow token cannot
          # push workflow-file changes, so restore/delete them for this commit and let
          # the connected GitHub app apply those validated workflow files afterward.
          git restore .github/workflows
          rm -f .github/workflows/observatory-verify.yml .github/workflows/postdeploy-observatory-audit.yml .github/workflows/verify-observatory-edges-production.yml
          rm -rf apps/observatory/node_modules apps/observatory/.next apps/observatory/tsconfig.tsbuildinfo
          python - <<'PY'
          from pathlib import Path
          import json
          path = Path('docs/control/policy-registry.json')
          policy = json.loads(path.read_text())
          workflow = '.github/workflows/observatory-verify.yml'
          policy['required_workflows'] = [x for x in policy['required_workflows'] if x != workflow]
          path.write_text(json.dumps(policy, indent=2) + '\n')
          PY
          python scripts/validate_control_layer.py
          python scripts/validate_build_ready_traceability.py
          git diff --check
          git add -A
          git config user.name 'Harbourview Consolidation Bot'
          git config user.email 'harbourviewcompany@gmail.com'
          git commit -m 'feat(observatory): consolidate frontend and BFF into Brain'
          git push origin HEAD:consolidate/observatory-into-brain-20260826
